# =========================================================
# Blowfish Theme Parameters
# https://blowfish.page/docs/configuration/
# =========================================================

# -----------------------
# Appearance
# -----------------------
colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableA11y = false
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = false
enableEmoji = true

replyByEmail = false

# -----------------------
# Images & Media
# -----------------------
defaultBackgroundImage = "images/Back.jpg"
# defaultFeaturedImage = "img/default-feature.jpg"
# defaultSocialImage = "img/og.png"

hotlinkFeatureImage = false
disableImageOptimization = false
disableImageOptimizationMD = false

fingerprintAlgorithm = "sha512"

# -----------------------
# Header
# -----------------------
[header]
  layout = "fixed-fill-blur"
  # valid options:
  # basic | fixed | fixed-fill | fixed-gradient | fixed-fill-blur

# -----------------------
# Footer
# -----------------------
[footer]
  showMenu = true
  showCopyright = false
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

# -----------------------
# Homepage
# -----------------------
[homepage]
  layout = "hero"
  homepageImage = "images/Back.jpg"

  showRecent = true
  showRecentItems = 6

  showMoreLink = true
  showMoreLinkDest = "/posts/"

  cardView = true
  cardViewScreenWidth = false

  layoutBackgroundBlur = true
  disableHeroImageFilter = false

# -----------------------
# Article Pages
# -----------------------
[article]
  showDate = true
  showDateOnlyInArticle = false
  showDateUpdated = false

  showAuthor = true
  showAuthorsBadges = false

  showHero = true
  heroStyle = "background"
  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = true

  showBreadcrumbs = false
  showDraftLabel = true

  showReadingTime = true
  showWordCount = true
  showHeadingAnchors = true
  showTableOfContents = true

  showPagination = true
  invertPagination = false

  showTaxonomies = false
  showCategoryOnly = false

  showZenMode = true

  showViews = false
  showLikes = false

  showEdit = false
  # editURL = "https://github.com/USERNAME/REPO/"
  editAppendPath = true

  seriesOpened = false

# -----------------------
# List Pages (posts, ctf, projects)
# -----------------------
[list]
  showHero = true
  heroStyle = "background"

  layoutBackgroundBlur = true
  layoutBackgroundHeaderSpace = false

  showBreadcrumbs = false
  showSummary = false

  showViews = false
  showLikes = false

  showTableOfContents = false

  showCards = true
  cardView = true
  cardViewScreenWidth = false

  orderByWeight = false
  groupByYear = true
  constrainItemsWidth = false

# -----------------------
# Taxonomy Pages (tags, categories, series)
# -----------------------
[taxonomy]
  showTermCount = true
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = true

# -----------------------
# Term Pages (single tag/category)
# -----------------------
[term]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = false
  cardView = true
  cardViewScreenWidth = false

# -----------------------
# Sitemap
# -----------------------
[sitemap]
  excludedKinds = ["taxonomy", "term"]

# -----------------------
# Firebase (Views & Likes)
# -----------------------
[firebase]
  # apiKey = "XXXX"
