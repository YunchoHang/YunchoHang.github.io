theme = "blowfish"
baseURL = "https://YunchoHang.github.io/"
canonifyURLs = true
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false
enableEmoji = true

mainSections = ["posts", "projects"]

ignoreFiles = [
  "themes/blowfish/exampleSite/.*",
  "themes/blowfish/archetypes/.*",
  "themes/blowfish/README\\.md",
  "themes/blowfish/LICENSE",
  "themes/blowfish/CHANGELOG\\.md"
]

googleAnalytics = "G-0Z1ZE7CENM"

title = "ThatGuysBroke"
author = "YunchoHang"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "series"
    weight = 50
  [[related.indices]]
    name = "authors"
    weight = 20
  [[related.indices]]
    name = "date"
    weight = 10
  [[related.indices]]
    name = "fragmentrefs"
    type = "fragments"
    weight = 10
    applyFilter = false